<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Swift Treinamentos | Portal de Capacitação</title>
<meta name="description" content="Portal de treinamento, mini provas e acompanhamento de aprendizagem para equipes.">
<meta name="theme-color" content="#e8431a">

<style>

:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1f;--mut:#6b6b70;--bd:#e3e1dc;--ac:#e8431a;--ac2:#fff1ec;--ok:#14803c;--warn:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e21;--tx:#f2f2f3;--mut:#9b9ba1;--bd:#33333a;--ac:#ff6a3d;--ac2:#2b1d18;--ok:#4ade80;--warn:#f87171;color-scheme:dark}}

:root[data-theme="dark"]{--bg:#141416;--card:#1e1e21;--tx:#f2f2f3;--mut:#9b9ba1;--bd:#33333a;--ac:#ff6a3d;--ac2:#2b1d18;--ok:#4ade80;--warn:#f87171;color-scheme:dark}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

.logo{font-weight:800;font-size:20px;letter-spacing:-.5px}.logo b{color:var(--ac)}

main{max-width:860px;margin:0 auto;padding:16px}

nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--bd)}

nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}

nav button.on{color:var(--ac);border-color:var(--ac)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}

h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 4px;font-size:17px}

.mut{color:var(--mut);font-size:14px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ac2);color:var(--ac)}

.badge.late{background:transparent;color:var(--warn);border:1px solid var(--warn)}.badge.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}

.code{font:700 22px ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--ac)}

button.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}

button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}

button.del{background:transparent;color:var(--warn);border:1px solid var(--warn)}

label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}

label.op{font-weight:400;font-size:16px;margin:8px 0;display:flex;gap:8px;align-items:center}

input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}

textarea{min-height:110px;resize:vertical}

a{color:var(--ac);font-weight:600}

.seg{display:flex;gap:6px}.seg button{flex:1}

.err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

.stat{text-align:center}.stat .n{font-size:32px;font-weight:800;color:var(--ac);line-height:1.1}

.login{max-width:400px;margin:40px auto}
.demo-box{margin-top:16px;padding:12px;border:1px dashed var(--bd);border-radius:10px;background:var(--bg)}

.vid{margin:8px 0 16px}.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}

.txt{white-space:pre-wrap}.li{cursor:pointer}

.trk{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.fil{height:100%;background:var(--ac)}

.empty{text-align:center;color:var(--mut);padding:32px 8px}
.notice{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.notice strong{color:var(--tx)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:3px}

</style>

</head>

<body>

<header><div class="logo">swift<b>.</b> treinamentos</div><div id="who" class="row"></div></header>

<main>
  <aside class="notice" role="note"><strong>Versão de demonstração.</strong> As contas, atividades e resultados ficam apenas neste navegador. Não compartilham dados entre celulares ou computadores e não devem ser usados para registrar informações reais ou senhas pessoais.</aside>
  <div id="app"></div>
</main>

<script>

const ADMIN="202526";

let db,me=null,tab="",open=null,role="f",err="",mode="in",ntype="t",fresh=false;

function load(){try{db=JSON.parse(localStorage.getItem("swift_db2")||"null")}catch(e){db=null}if(!db)db={users:{},tasks:[],done:[]}}

// Apenas contas PUBLICAS de demonstracao. Nunca cadastre senhas reais no GitHub.
const DEMO_FALLBACK={
  team:"TESTE123",
  users:[
    {name:"Gerente Demo",role:"g",password:"Teste@123"},
    {name:"Funcionario Teste",role:"f",password:"Teste@123"}
  ]
};

async function seedDemoAccounts(){
  let config=DEMO_FALLBACK;
  // No GitHub Pages, esta configuracao e lida da pasta /logins/.
  // Ao abrir index.html diretamente, usa a configuracao de reserva acima.
  try {
    const response=await fetch("./logins/contas-teste.json",{cache:"no-store"});
    if(response.ok)config=await response.json();
  } catch(e) { /* arquivo local ou rede indisponivel */ }
  if(!config || !/^[A-Za-z0-9]{8}$/.test(config.team) || !Array.isArray(config.users))config=DEMO_FALLBACK;
  let changed=false;
  for(const entry of config.users){
    if(!entry || !["f","g"].includes(entry.role) || typeof entry.name!=="string" || typeof entry.password!=="string")continue;
    const key=uid(entry.name,entry.role);
    if(!db.users[key]){
      db.users[key]={id:key,name:entry.name,pass:entry.password,role:entry.role,since:Date.now(),team:config.team,demo:true};
      changed=true;
    }
  }
  if(!db.tasks.some(t=>t.id==="prova-demo-swift")){
    db.tasks.push({
      id:"prova-demo-swift",type:"q",title:"Mini prova de demonstração",due:"2027-12-31",points:30,
      team:config.team,by:"Gerente Demo",created:Date.now(),demo:true,
      qs:[
        {q:"Qual é uma boa prática ao atender um cliente?",o:["Escutar e esclarecer dúvidas","Ignorar perguntas","Responder sem verificar","Interromper o atendimento"],c:0},
        {q:"O que fazer quando não se sabe uma resposta?",o:["Inventar uma informação","Consultar a orientação correta","Encerrar a conversa","Evitar o cliente"],c:1},
        {q:"O que é importante ao concluir um atendimento?",o:["Não conferir nada","Falar rapidamente","Confirmar se a dúvida foi resolvida","Omitir informações"],c:2}
      ]
    });
    changed=true;
  }
  if(changed)save();
}

function demoLogin(){
  const demo=db.users[uid("Funcionario Teste","f")];
  if(!demo)return setErr("Conta de teste indisponível. Atualize a página.");
  me=demo;role="f";err="";open=null;tab="pend";render();
}

function save(){try{localStorage.setItem("swift_db2",JSON.stringify(db))}catch(e){}}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fd=t=>new Date(t).toLocaleDateString("pt-BR");

const uid=(n,r)=>r+":"+n.trim().toLowerCase().replace(/\s+/g," ");

const isMgr=()=>me&&me.role==="g";

const $=i=>document.getElementById(i);

const val=i=>($(i)||{value:""}).value;

const users=()=>Object.values(db.users);

const mgrOf=c=>users().find(x=>x.role==="g"&&x.team===c);

const members=()=>users().filter(u=>u.role==="f"&&u.team===me.team);

const tTasks=()=>db.tasks.filter(t=>t.team===me.team);

const mine=()=>db.done.filter(d=>d.uid===me.id);

const doneBy=u=>db.done.filter(d=>d.uid===u);

const late=t=>new Date(t.due+"T23:59:59")<new Date();

function gen(){const A="abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";let c;do{c=[...Array(8)].map(()=>A[Math.random()*A.length|0]).join("")}while(!/[a-z]/.test(c)||!/[A-Z]/.test(c)||!/\d/.test(c)||users().some(u=>u.team===c));return c}

const setErr=m=>{err=m;if($("err"))$("err").textContent=m};



function login(){

 const n=val("n").trim().replace(/\s+/g," "),p=val("p"),c=val("c").trim(),tc=val("tc").trim();

 if(n.split(" ").length<2)return setErr("Digite seu nome completo (nome e sobrenome).");

 if(!p)return setErr("Digite sua senha.");

 if(role==="g"&&c!==ADMIN)return setErr("Código da administração inválido.");

 const k=uid(n,role),u=db.users[k];

 if(mode==="up"){

  if(u)return setErr("Já existe uma conta com esse nome. Use a opção Entrar.");

  if(p.length<4)return setErr("A senha deve ter pelo menos 4 caracteres.");

  if(p!==val("p2"))return setErr("As senhas não coincidem.");

  if(role==="f"&&!mgrOf(tc))return setErr("Código de equipe inválido. Peça o código de 8 dígitos ao seu gerente.");

  db.users[k]={id:k,name:n,pass:p,role,since:Date.now(),team:role==="g"?gen():tc};fresh=role==="g";

 }else{

  if(!u)return setErr("Conta não encontrada. Se é seu primeiro acesso, clique em Cadastre-se.");

  if(u.pass!==p)return setErr("Senha incorreta.");

  if(u.role==="g"&&!u.team)u.team=gen();

 }

 save();me=db.users[k];err="";open=null;tab=isMgr()?"nova":"pend";render();

}

function join(){const tc=val("tc").trim();if(!mgrOf(tc))return setErr("Código de equipe inválido.");me.team=tc;save();err="";tab="pend";render()}

function logout(){me=null;open=null;err="";fresh=false;mode="in";role="f";render()}

const setRole=r=>{role=r;err="";render()},setMode=m=>{mode=m;err="";render()},setType=t=>{ntype=t;err="";render()};

const go=t=>{tab=t;open=null;fresh=false;render()};
function showTask(id){open=id;render()}
function closeTask(){open=null;render()}



function vid(u){
  if(!u || !/^https?:\/\//i.test(u)) return "";
  let h="";
  try {
    const url=new URL(u), host=url.hostname.toLowerCase().replace(/^www\./, "");
    let id="";
    if(host==="youtu.be") id=url.pathname.split("/")[1] || "";
    if(["youtube.com","m.youtube.com","music.youtube.com","youtube-nocookie.com"].includes(host)) {
      id = url.searchParams.get("v") || url.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/)?.[1] || "";
    }
    if(/^[\w-]{11}$/.test(id)) {
      h=`<iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Vídeo do treinamento" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
    } else if(/\.(mp4|webm|ogg)(\?|$)/i.test(u)) {
      h=`<video controls preload="metadata" src="${esc(u)}"></video>`;
    }
  } catch(e) { return ""; }
  return `<div class="vid">${h}<a class="mut" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Abrir vídeo em nova aba ↗</a></div>`;
}

function addQ(){const i=document.querySelectorAll(".qb").length;$("qs").insertAdjacentHTML("beforeend",`<div class="card qb"><b>Pergunta ${i+1}</b><input class="qq" placeholder="Enunciado">${[0,1,2,3].map(j=>`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><input type="radio" name="c${i}" value="${j}" ${j?"":"checked"} style="width:auto"><input class="qo" placeholder="Alternativa ${"ABCD"[j]}"></div>`).join("")}<div class="mut">Marque a alternativa correta.</div></div>`)}

function delQ(){const l=$("qs").lastElementChild;if(l&&$("qs").children.length>1)l.remove()}



function postTask(){

 const q=ntype==="q",t={id:"t"+Date.now(),type:ntype,title:val("tt").trim(),due:val("td"),points:parseInt(val("tp"),10),team:me.team,by:me.name,created:Date.now()};

 if(!t.title||!t.due||!(t.points>0))return setErr("Preencha título, prazo e pontos.");

 if(q){

  t.qs=[...document.querySelectorAll(".qb")].map(b=>({q:b.querySelector(".qq").value.trim(),o:[...b.querySelectorAll(".qo")].map(x=>x.value.trim()),c:+b.querySelector("input[type=radio]:checked").value}));

  if(t.qs.some(x=>!x.q||x.o.some(o=>!o)))return setErr("Preencha todas as perguntas e as 4 alternativas de cada uma.");

 }else{

  Object.assign(t,{vp:val("tvp").trim(),vt:val("tvt").trim(),text:val("tx").trim()});

  if(!t.vp||!t.vt||!t.text)return setErr("Preencha os vídeos e a explicação teórica.");

  if(!/^https?:\/\//i.test(t.vp)||!/^https?:\/\//i.test(t.vt))return setErr("Os links dos vídeos devem começar com http:// ou https://");

 }

 db.tasks.push(t);save();err="";tab="posted";render();

}

function delTask(id){if(!confirm("Excluir esta atividade?"))return;db.tasks=db.tasks.filter(t=>t.id!==id);db.done=db.done.filter(d=>d.taskId!==id);save();render()}

function finish(id){

 const t=db.tasks.find(x=>x.id===id);if(!t||mine().some(d=>d.taskId===id))return;

 const r={uid:me.id,taskId:id,at:Date.now(),points:t.points};

 if(t.type==="q"){

  let s=0;

  for(let i=0;i<t.qs.length;i++){const a=document.querySelector(`input[name=a${i}]:checked`);if(!a)return setErr("Responda todas as perguntas.");if(+a.value===t.qs[i].c)s++}

  Object.assign(r,{score:s,total:t.qs.length,points:Math.round(t.points*s/t.qs.length)});

 }

 db.done.push(r);save();open=id;render();

}



function taskCard(t){

 const d=mine().find(x=>x.taskId===t.id),q=t.type==="q";

 const b=d?`<span class="badge ok">Concluída em ${fd(d.at)}${q?` · ${d.score}/${d.total}`:""}</span>`:late(t)?`<span class="badge late">Atrasada</span>`:"";

 return`<div class="card li" onclick="showTask('${t.id}')"><div class="row" style="justify-content:space-between"><h3>${esc(t.title)}</h3><span class="badge">${q?"Mini prova · até ":""}+${t.points} pts</span></div>

 <div class="mut">Prazo: ${fd(t.due+"T12:00:00")} · Postada por ${esc(t.by)}</div><div style="margin-top:6px">${b}</div></div>`;

}

function detail(t){

 const d=mine().find(x=>x.taskId===t.id),q=t.type==="q",lock=d||isMgr();

 const body=q?t.qs.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.q)}</b>${x.o.map((o,j)=>`<label class="op"><input type="radio" name="a${i}" value="${j}" ${lock?"disabled":""} style="width:auto"> ${esc(o)}${lock&&j===x.c?" ✓":""}</label>`).join("")}</div>`).join("")

  :`<h3 style="margin-top:16px">Explicação teórica</h3><p class="txt">${esc(t.text)}</p><h3>Vídeo teórico</h3>${vid(t.vt)}<h3>Vídeo prático</h3>${vid(t.vp)}`;

 const act=d?`<span class="badge ok">Concluída em ${fd(d.at)}${q?` · Nota ${d.score}/${d.total} · +${d.points} pts`:""}</span>`:isMgr()?"":`<div class="err" id="err"></div><button class="btn" onclick="finish('${t.id}')">${q?"Enviar respostas":"Marcar como concluída"}</button>`;

 return`<button class="btn sec" onclick="closeTask()">← Voltar</button><div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><h2>${esc(t.title)}</h2><span class="badge">${q?"Mini prova":"Treinamento"} · ${t.points} pts</span></div>

 <div class="mut">Prazo: ${fd(t.due+"T12:00:00")} · Postada por ${esc(t.by)}</div>${body}${act}</div>`;

}

const bar=(l,p,t)=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span>${esc(l)}</span><span class="mut">${t}</span></div><div class="trk"><div class="fil" style="width:${p}%"></div></div></div>`;

const pc=(a,b)=>b?Math.round(a/b*100):0;



function periods(){

 const now=new Date(),sd=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dow=(sd.getDay()+6)%7;

 const st={dia:sd,semana:new Date(sd.getTime()-dow*864e5),mes:new Date(now.getFullYear(),now.getMonth(),1),ano:new Date(now.getFullYear(),0,1)},r={};

 for(const k in st){const l=mine().filter(d=>d.at>=st[k].getTime());r[k]={n:l.length,p:l.reduce((s,d)=>s+d.points,0)}}return r;

}

function teamView(){

 const ms=members(),ts=tTasks();

 if(!ms.length)return`<div class="card"><h3>Nenhum colaborador na equipe ainda</h3><p class="mut">Compartilhe o código <span class="code">${me.team}</span> com seus colaboradores para que eles entrem na equipe ao se cadastrar.</p></div>`;

 const per=ms.map(u=>{const d=doneBy(u.id).filter(x=>ts.some(t=>t.id===x.taskId));return{u,n:d.length,p:d.reduce((s,x)=>s+x.points,0)}});

 const tot=per.reduce((s,x)=>s+x.n,0);

 const acts=ts.map(t=>{const d=db.done.filter(x=>x.taskId===t.id&&ms.some(m=>m.id===x.uid)),av=t.type==="q"&&d.length?` · média ${pc(d.reduce((s,x)=>s+x.score/x.total,0),d.length)}%`:"";return bar(t.title+(t.type==="q"?" (prova)":""),pc(d.length,ms.length),`${d.length}/${ms.length}${av}`)}).join("");

 return`<div class="grid"><div class="card stat"><div class="mut">Colaboradores</div><div class="n">${ms.length}</div></div><div class="card stat"><div class="mut">Atividades</div><div class="n">${ts.length}</div></div><div class="card stat"><div class="mut">Conclusão média</div><div class="n">${pc(tot,ms.length*ts.length)}%</div></div></div>

 <div class="card"><h3>Desempenho por colaborador</h3>${per.sort((a,b)=>b.n-a.n).map(x=>bar(x.u.name,pc(x.n,ts.length),`${x.n}/${ts.length} · ${x.p} pts`)).join("")}</div>

 <div class="card"><h3>Conclusão por atividade</h3>${acts||`<p class="mut">Nenhuma atividade postada.</p>`}</div>`;

}



function view(){

 if(isMgr()){

  if(tab==="nova"){const q=ntype==="q";return`${fresh?`<div class="card"><h3>Conta criada! 🎉</h3><p class="mut">Este é o código da sua equipe. Compartilhe com seus colaboradores:</p><div class="code">${me.team}</div></div>`:""}

  <div class="card"><h2>Nova atividade</h2><div class="seg"><button class="btn ${q?"sec":""}" onclick="setType('t')">Treinamento</button><button class="btn ${q?"":"sec"}" onclick="setType('q')">Mini prova</button></div>

  <label>Título</label><input id="tt" placeholder="${q?"Ex.: Prova de atendimento":"Ex.: Atendimento ao cliente no caixa"}">

  <div class="row"><div style="flex:1;min-width:150px"><label>Prazo para confecção</label><input id="td" type="date"></div><div style="flex:1;min-width:150px"><label>Pontos da lição</label><input id="tp" type="number" min="1" placeholder="Ex.: 50"></div></div>

  ${q?`<div id="qs" style="margin-top:12px"></div><div class="row"><button class="btn sec" onclick="addQ()">+ Pergunta</button><button class="btn del" onclick="delQ()">Remover última</button></div><p class="mut">Os pontos são proporcionais ao número de acertos.</p>`

    :`<label>Vídeo prático (link)</label><input id="tvp" type="url" placeholder="https://youtube.com/watch?v=..."><label>Vídeo teórico (link)</label><input id="tvt" type="url" placeholder="https://youtube.com/watch?v=..."><label>Explicação teórica</label><textarea id="tx" placeholder="Explique o conteúdo do treinamento..."></textarea>`}

  <div class="err" id="err">${esc(err)}</div><button class="btn" onclick="postTask()">Publicar atividade</button></div>`}

  if(tab==="posted"){

   if(open){const t=db.tasks.find(x=>x.id===open);if(t)return detail(t)}

   const ts=tTasks(),ms=members();

   if(!ts.length)return`<div class="empty">Nenhuma atividade postada ainda.</div>`;

   return[...ts].reverse().map(t=>{

    const ok=db.done.filter(d=>d.taskId===t.id),on=ms.filter(m=>ok.some(d=>d.uid===m.id)),off=ms.filter(m=>!on.includes(m)),nm=l=>l.map(x=>esc(x.name)).join(", ")||"—";

    return`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(t.title)}</h3><span class="badge">${t.type==="q"?"Mini prova · ":""}+${t.points} pts</span></div>

    <div class="mut">Prazo: ${fd(t.due+"T12:00:00")}</div>

    <p style="margin:8px 0 2px"><b style="color:var(--ok)">✓ Fizeram (${on.length}):</b> <span class="mut">${nm(on).replace(/^—$/,"ninguém")}${t.type==="q"?" · notas: "+on.map(m=>{const d=ok.find(x=>x.uid===m.id);return d.score+"/"+d.total}).join(", "):""}</span></p>

    <p style="margin:2px 0 8px"><b style="color:var(--warn)">✗ Pendentes (${off.length}):</b> <span class="mut">${nm(off).replace(/^—$/,"ninguém")}</span></p>

    <div class="row"><button class="btn sec" onclick="showTask('${t.id}')">Ver</button><button class="btn del" onclick="delTask('${t.id}')">Excluir</button></div></div>`}).join("");

  }

  if(tab==="team")return teamView();

 } else {

  if(open){const t=db.tasks.find(x=>x.id===open);if(t)return detail(t)}

  if(tab==="pend"){

   const l=tTasks().filter(t=>!mine().some(d=>d.taskId===t.id)).sort((a,b)=>a.due.localeCompare(b.due));

   return l.length?l.map(taskCard).join(""):`<div class="empty">Tudo em dia! Nenhum treinamento a realizar.</div>`;

  }

  if(tab==="done"){

   const l=[...mine()].sort((a,b)=>b.at-a.at).map(d=>db.tasks.find(t=>t.id===d.taskId)).filter(Boolean);

   return l.length?l.map(taskCard).join(""):`<div class="empty">Você ainda não concluiu nenhum treinamento.</div>`;

  }

  if(tab==="hist"){

   const p=periods(),L={dia:"Hoje",semana:"Esta semana",mes:"Este mês",ano:"Este ano"},rec=[...mine()].sort((a,b)=>b.at-a.at).slice(0,15);

   return`<div class="grid">${Object.keys(p).map(k=>`<div class="card stat"><div class="mut">${L[k]}</div><div class="n">${p[k].n}</div><div class="mut">atividades · ${p[k].p} pts</div></div>`).join("")}</div>

   <div class="card"><h3>Atividade recente</h3>${rec.length?rec.map(d=>{const t=db.tasks.find(x=>x.id===d.taskId);return`<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)"><span>${esc(t?t.title:"(removida)")}</span><span class="mut">${new Date(d.at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})} · +${d.points}</span></div>`}).join(""):`<p class="mut">Sem atividades registradas.</p>`}</div>`;

  }

 }

 const pts=mine().reduce((s,d)=>s+d.points,0),g=mgrOf(me.team);

 const extra=isMgr()?`<div class="card stat"><div class="mut">Atividades postadas</div><div class="n">${tTasks().length}</div></div><div class="card stat"><div class="mut">Colaboradores</div><div class="n">${members().length}</div></div>`

  :`<div class="card stat"><div class="mut">Pontos</div><div class="n">${pts}</div></div><div class="card stat"><div class="mut">Concluídos</div><div class="n">${mine().length}</div></div><div class="card stat"><div class="mut">A realizar</div><div class="n">${tTasks().filter(t=>!mine().some(d=>d.taskId===t.id)).length}</div></div>`;

 return`<div class="card"><h2>${esc(me.name)}</h2><span class="badge">${isMgr()?"Gerente":"Funcionário"}</span>

 <p class="mut">Conta criada em ${fd(me.since)}${!isMgr()&&g?` · Equipe de ${esc(g.name)}`:""}</p>${isMgr()?`<div class="mut">Código da equipe</div><div class="code">${me.team}</div>`:""}</div><div class="grid">${extra}</div>`;

}



function render(){

 const app=$("app"),w=$("who");

 if(!me){

  w.innerHTML="";const up=mode==="up";

  app.innerHTML=`<div class="card login"><h2>${up?"Criar conta":"Entrar"}</h2>

  <div class="seg"><button class="btn ${role==="f"?"":"sec"}" onclick="setRole('f')">Funcionário</button><button class="btn ${role==="g"?"":"sec"}" onclick="setRole('g')">Gerente</button></div>

  <label>Nome completo</label><input id="n" autocomplete="name" placeholder="Nome e sobrenome">

  <label>Senha</label><input id="p" type="password" autocomplete="${up?"new-password":"current-password"}">

  ${up?`<label>Confirmar senha</label><input id="p2" type="password" autocomplete="new-password">`:""}

  ${role==="g"?`<label>Código da administração</label><input id="c" type="password" inputmode="numeric">`:up?`<label>Código da equipe (8 dígitos, fornecido pelo seu gerente)</label><input id="tc" maxlength="8" autocapitalize="off" autocomplete="off" placeholder="Ex.: aB3dE9xK">`:""}

  <div class="err" id="err">${esc(err)}</div>

  <button class="btn" style="width:100%" onclick="login()">${up?"Cadastrar":"Entrar"}</button>

  <p class="mut" style="text-align:center">${up?`Já tem conta? <a href="#" onclick="setMode('in');return false">Entrar</a>`:`Primeiro acesso? <a href="#" onclick="setMode('up');return false">Cadastre-se</a>`}</p>
  ${!up && role==="f"?`<div class="demo-box"><p class="mut" style="margin:0 0 8px"><strong>Conta pública de demonstração</strong><br>Funcionário: Funcionario Teste<br>Senha: Teste@123</p><button class="btn sec" style="width:100%" onclick="demoLogin()">Entrar como funcionário de teste</button></div>`:""}</div>`;

  return;

 }

 w.innerHTML=`${isMgr()?`<span class="badge">Equipe: ${me.team}</span>`:""}<span class="mut">${esc(me.name.split(" ")[0])}</span><button class="btn sec" onclick="logout()">Sair</button>`;

 if(!isMgr()&&!me.team){app.innerHTML=`<div class="card login"><h2>Entrar em uma equipe</h2><p class="mut">Digite o código de 8 dígitos da equipe do seu gerente.</p><input id="tc" maxlength="8" autocapitalize="off" autocomplete="off"><div class="err" id="err"></div><button class="btn" style="width:100%" onclick="join()">Entrar na equipe</button></div>`;return}

 const tabs=isMgr()?[["nova","Nova atividade"],["posted","Postadas"],["team","Equipe"],["perfil","Meu perfil"]]:[["pend","A realizar"],["done","Concluídos"],["hist","Histórico"],["perfil","Meu perfil"]];

 app.innerHTML=`<nav>${tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}</nav>${view()}`;

 if(isMgr()&&tab==="nova"&&ntype==="q")addQ();

}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!me)login()});

async function init(){load();await seedDemoAccounts();render()}
init();

</script>
